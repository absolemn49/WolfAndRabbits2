services:
  game:
    image: wolf-and-rabbits:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wolf-and-rabbits
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8080"
    environment:
      - GAME_ENV=Release
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
